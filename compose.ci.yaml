services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: ci-database-password
      POSTGRES_DB: mattermost
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mattermost", "-d", "mattermost"]
      interval: 3s
      timeout: 3s
      retries: 20

  mattermost:
    image: mattermost/mattermost-team-edition:12.1.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8066:8065"
    environment:
      MM_SERVICESETTINGS_SITEURL: http://localhost:8066
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mattermost:ci-database-password@postgres:5432/mattermost?sslmode=disable"
      MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"