name: Mattermost Playwright tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      MM_BASE_URL: http://localhost:8066
      MM_AUTH_DIR: playwright/.auth-ci
      MM_ADMIN_LOGIN: employee1
      MM_ADMIN_PASSWORD: "CiAdmin-Test-2026!"
      MM_MEMBER_LOGIN: studyuser312
      MM_MEMBER_PASSWORD: "CiMember-Test-2026!"
      MM_TARGET_PASSWORD: "CiTarget-Test-2026!"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Mattermost
        run: |
          docker compose -p mattermost-ci -f compose.ci.yaml up -d
          curl --fail --max-time 5 --retry 30 --retry-delay 2 --retry-all-errors \
            "$MM_BASE_URL/api/v4/system/ping"

      - name: Create test accounts and team
        run: bash seed-ci.sh

      - name: Run Playwright tests
        run: npx playwright test --project=chromium --workers=1 --reporter=list,html

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Print Mattermost logs on failure
        if: ${{ failure() }}
        run: docker compose -p mattermost-ci -f compose.ci.yaml logs --tail=100

      - name: Stop test containers
        if: ${{ always() }}
        run: docker compose -p mattermost-ci -f compose.ci.yaml down -v